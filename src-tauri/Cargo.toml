[package]
name = "trayce"
version = "0.1.0"
description = "Trayce - a multi-window file manager"
authors = ["hinatahugu29"]
license = ""
repository = ""
edition = "2021"
# File::try_lock（二重起動の防止）に 1.89 が要る。
rust-version = "1.89"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = ["protocol-asset"] }
tauri-plugin-log = "2"
tauri-plugin-drag = "2.1.1"
dirs = "6.0.0"
base64 = "0.23.0"
tauri-plugin-global-shortcut = "2.3.2"
trash = "5.2.3"
tauri-plugin-opener = "2.5.4"
# Windows では ReadDirectoryChangesW を使う。既定の features で足りる。
notify = "8.2.0"
zip = { version = "4.2.0", default-features = false, features = ["deflate"] }

[target."cfg(windows)".dependencies]
clipboard-win = "5"
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_UI_Shell", "Win32_UI_Shell_Common", "Win32_UI_WindowsAndMessaging", "Win32_System_Com"] }

# ドラッグ部品（drag 2.1.1）の修正版を使う。
# 元のままだとネットワークドライブのファイルを `\\?\UNC\...` に変換してしまい、
# Windows がそれを受け付けずにアプリごと落ちる。変更点は vendor/drag/PATCHES.md を参照。
[patch.crates-io]
drag = { path = "vendor/drag" }
