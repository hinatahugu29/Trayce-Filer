[package]
name = "filer-native"
version = "0.1.0"
edition = "2021"
authors = ["Filer Team"]
description = "GPU-accelerated native GUI filer powered by Rust and Slint"

[build-dependencies]
slint-build = "1.17.1"

[dependencies]
slint = { version = "1.17.1", default-features = false, features = ["std", "backend-winit", "renderer-femtovg", "compat-1-2"] }
dirs = "6.0.0"
chrono = "0.4.38"
trash = "5.2.3"

[profile.dev]
incremental = false
codegen-units = 1

[profile.release]
codegen-units = 1
lto = "thin"
opt-level = 3
